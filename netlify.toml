[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Short, revalidate-friendly cache — filenames here don't change when
    # content does, so a long/immutable cache would hide future edits from
    # returning visitors (including us, testing changes) for up to a year.
    Cache-Control = "public, max-age=600, must-revalidate"
